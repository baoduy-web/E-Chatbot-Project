# Bất biến của hệ thống — lời hứa mà KHÔNG agent hay người nào được phá lặng lẽ.
# 🔒 Vùng bảo vệ `design`. Thêm/sửa bất biến = quyết định của người (docs/GOVERNANCE.md §3).
# Mỗi bất biến `automated` trỏ tới lưới canh THẬT (`đường/dẫn.py::tên_test` hoặc file workflow);
# tests/guards/test_invariants_registry.py đỏ nếu trỏ vào khoảng không, hoặc nếu có lưới canh mồ côi.
# Bất biến miền của dự án: thêm với mã INV-D01, INV-D02... (xem docs/rules/10-domain-safety.md).
version: 1


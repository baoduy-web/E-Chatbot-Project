    severity: medium
    owner: R3
    statement: >-
      Hook pre-push tắt mặc định (luồng agent tự mở PR không đổi); bật bằng `git config agentctl.pushGate on` thì chặn
      mọi lần đẩy trừ khi chủ repo đặt ALLOW_PUSH=1, NHƯNG luôn cho nhánh `agent-claims` đi qua — nếu không `agentctl
      start` hỏng. Công tắc chung AGENTCTL_HOOKS=off không mở được cổng này.
    enforcement: automated
    enforced_by:
